name: Tagged launcher release
on:
  push:
    tags: ['*']
permissions:
  contents: read
concurrency:
  group: launcher-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'Flinterino/wz-sync'
    runs-on: windows-latest
    timeout-minutes: 20
    outputs:
      sha256: ${{ steps.package.outputs.sha256 }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - run: dotnet test --configuration Release
      - run: python -B -m unittest discover -s tools/release -p 'test_*.py'
      - id: package
        name: Build and compare two clean publishes
        shell: pwsh
        run: ./tools/release/Build-Launcher.ps1 -OutputDirectory (Join-Path $env:RUNNER_TEMP 'wz-launcher')
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: verified-launcher
          path: ${{ runner.temp }}/wz-launcher/
          if-no-files-found: error

  attach-draft:
    if: github.repository == 'Flinterino/wz-sync'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - run: dotnet build tools/WzSync.Release --configuration Release
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: verified-launcher
          path: ${{ runner.temp }}/wz-launcher
      - name: Validate the seeded draft and attach verified files
        run: python -B tools/release/attach_draft.py
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_EXE_SHA256: ${{ needs.build.outputs.sha256 }}
          LAUNCHER_DIRECTORY: ${{ runner.temp }}/wz-launcher
