name: Core tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main, codex/codex-home/core, codex/codex-home/wpf]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - run: dotnet test tests/WzSync.Core.Tests --configuration Release
      - if: runner.os == 'Windows'
        run: dotnet test tests/WzSync.App.Tests --configuration Release
      - run: python -B -m unittest discover -s tools/release -p 'test_*.py'
      - if: runner.os == 'Windows'
        name: Reproduce the single-file launcher
        shell: pwsh
        run: ./tools/release/Build-Launcher.ps1 -OutputDirectory (Join-Path $env:RUNNER_TEMP 'wz-launcher-smoke')
